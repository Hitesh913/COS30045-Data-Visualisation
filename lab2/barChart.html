<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="description"
content="Data Visualisation"/>
<meta name="keywords" content="HTML, CSS, D3"/>
<meta name="author" content="Hitesh Kumar"/>
<title>Task 2.1 D3 Data Binding</title>
<script src="https://d3js.org/d3.v5.min.js"></script>
</head> 
<body>
<h1>The D3 Journey starts here...</h1> 
<script>
//Example from Murray
var w = 500;
var h = 100;
var barPadding = 1;
var dataset = [14,5,26,23,9];

var svg = d3.select("body")
    .append("svg")
    .attr("width", w)
    .attr("height", h);

svg.selectAll("rect")
    .data(dataset)
    .enter()
    .append("rect")
    .attr("x", function(d, i) {
        return i * 21;
    })
    .attr("y", 0)
    .attr("width", (w / dataset.length) - barPadding)
    .attr("height", 100)
    .attr("x", function(d, i) {
        return i * (w / dataset.length);
    });
</script>
<h2>Step 5: Using Rectangles to Visualise our Data</h2>

<script>

// Example from Murray

var w = 500;
var h = 100;
var barPadding = 1;

var dataset = [14,5,26,23,9];

var svg = d3.select("body")
    .append("svg")
    .attr("width", w)
    .attr("height", h);

svg.selectAll("rect")
    .data(dataset)
    .enter()
    .append("rect")
    .attr("x", function(d, i) {
        return i * (w / dataset.length);
    })
.attr("y", 0)
.attr("height", function(d) {
    return d * 4;
})
    .attr("width", (w / dataset.length) - barPadding)
    .attr("fill", "steelblue");

</script>
</body>
</html>
